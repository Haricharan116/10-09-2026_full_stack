<!DOCTYPE html>
<html>
<head>
    <title>Employee Table</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid black;
            padding: 4px;
            text-align: left;
        }

        th {
            background-color: #d9ead3;
            color: #24618c;
            text-align: center;
            font-size: 20px;
        }

        td {
            background-color: #d9ead3;
            color: #24618c;
            font-size: 18px;
        }

        td:first-child {
            width: 38%;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th colspan="2">EMPLOYEE TABLE</th>
        </tr>

        <tr>
            <td>EMPLOYEE_ID</td>
            <td>put empid</td>
        </tr>

        <tr>
            <td>FIRST_NAME</td>
            <td>first name</td>
        </tr>

        <tr>
            <td>LAST_NAME</td>
            <td>second name</td>
        </tr>

        <tr>
            <td>EMAIL</td>
            <td>email</td>
        </tr>

        <tr>
            <td>PHONE_NUMBER</td>
            <td>phone number</td>
        </tr>

        <tr>
            <td>JOB_ID</td>
            <td>job id</td>
        </tr>

        <tr>
            <td>SALARY</td>
            <td>salary salary</td>
        </tr>

        <tr>
            <td>Designation</td>
            <td>as manager,asst engineer,project head...</td>
        </tr>

    </table>

</body>
</html>
